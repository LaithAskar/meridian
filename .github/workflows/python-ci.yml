name: Python CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Python 3.11 core-offline + notebook export
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      JUPYTER_PATH: ${{ runner.temp }}/meridian-jupyter/share/jupyter
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install locked test dependencies
        run: >-
          python -m pip install
          --require-hashes
          --requirement requirements-ci.txt

      - name: Register the Python 3 notebook kernel
        run: >-
          python -m ipykernel install
          --prefix "${{ runner.temp }}/meridian-jupyter"
          --name python3
          --display-name "Meridian CI (Python 3.11)"

      - name: Compile backend, backtest, and CI guard sources
        run: python -m compileall -q backend backtest ci conftest.py

      # Dependency installation is complete. From this point forward a root-owned
      # OUTPUT chain rejects every new non-loopback IPv4/IPv6 connection for the
      # disposable job VM. Established runner-control traffic remains intact.
      - name: Enable job-level external-egress boundary
        run: |
          sudo ci/egress_guard.sh enable
          sudo ci/egress_guard.sh status

      - name: Prove local IPC works and native/child/notebook egress is blocked
        env:
          PYTHONPATH: ci
        run: python ci/probe_egress_guard.py

      # Explicit feasible scope: deterministic backend/backtest tests plus the
      # existing lightweight, offline notebook-export integration tests. Broker,
      # server, and heavyweight model suites are intentionally not installed.
      # MERIDIAN_FAIL_ON_SKIP makes scope erosion visible as a failing CI run.
      - name: Run zero-skip core-offline and notebook-export suite
        env:
          MERIDIAN_FAIL_ON_SKIP: "1"
          MPLBACKEND: Agg
          PYTHONPATH: ci
        run: >-
          python -m pytest
          backend/tests/test_paper_trader.py
          backtest/tests
          -q

      - name: Remove external-egress boundary
        if: always()
        run: sudo ci/egress_guard.sh disable
